<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Blog sobre tecnología, gimnasio y crecimiento personal." />
  <title>Mi blog</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/mediaquery.css" />
</head>

<body>
  <header>
    <section class="header-icons-container">
      <div class="header-icons">
        <a href="https://x.com/juanda4042" target="_blank" rel="noopener noreferrer">
          <img src="assets/icons/twitter.svg" alt="Twitter" />
        </a>
        <a href="https://www.facebook.com/Juandavidss" target="_blank" rel="noopener noreferrer">
          <img src="assets/icons/facebook-icon.svg" alt="Facebook" />
        </a>
        <a href="https://www.instagram.com/juanda404/" target="_blank" rel="noopener noreferrer">
          <img src="assets/icons/instagram-icon.svg" alt="Instagram" />
        </a>
        <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
          <img src="assets/icons/linkedin.svg" alt="LinkedIn" />
        </a>
        <a href="https://github.com/juanda404" target="_blank" rel="noopener noreferrer">
          <img src="assets/icons/github_light.svg" alt="GitHub" />
        </a>
      </div>
    </section>
    <nav>
      <section class="nav-logo-container">
        <a href="/"><img src="assets/images/logo.jpeg" alt="Logo of blog" /></a>
      </section>
      <section class="profile-link">
        <a href="/profile.html">About me</a>
      </section>
    </nav>
  </header>
  <!-- Main Content con diseño de 2 Columnas -->
  <main>
    <section class="hero-container">
      <!-- Columna Izquierda: Texto y Contenido -->
      <div class="left-column">
        <div class="text-content">
          <p class="greeting">¡Hello! I am Juan David ✨</p>
          <h1 class="main-title">
            Frontend Developer
            <span class="highlight">training body, mind, and code.</span>
          </h1>
          <p class="description">
            I share knowledge about technology, training routines, and mindset to become a better version of myself
            every day.
          </p>
        </div>

        <!-- Íconos Flotantes (Re-integrados) -->
        <div class="floating-icons-group">
          <div class="icon-block code-icon">
            <span class="icon-visual">&lt;/&gt;</span>
            <p class="icon-label">Technology</p>
          </div>
          <div class="icon-block gym-icon">
            <span class="icon-visual">🏋️‍♂️</span>
            <p class="icon-label">Gym Training</p>
          </div>
          <div class="icon-block mindset-icon">
            <span class="icon-visual">🧠</span>
            <p class="icon-label">Mindset & Growth</p>
          </div>
        </div>

        <!-- Botones de Acción -->
        <div class="action-buttons">
          <button class="btn btn-primary"><a href="articulos.html">Leer artículos</a></button>
          <button class="btn btn-secondary"><a href="https://jdsg.netlify.app/" target="_blank">Ver
              portafolio</a></button>
        </div>
      </div>

      <!-- Columna Derecha: Imagen Principal -->
      <div class="right-column">
        <div class="subject-center-container">
          <img src="assets/images/JDSG1.png" alt="Hero image" class="subject-image" />
          <div class="subject-glow"></div>
        </div>
      </div>

    </section>
  </main>
</body>

</html>
